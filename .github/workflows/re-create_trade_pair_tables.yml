name: Recreate MIS-NRML Trade Pair Tables

on:
  workflow_dispatch:

jobs:
  recreate-tables:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_KEY_JSON }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install BigQuery dependency
        run: pip install google-cloud-bigquery

      - name: Recreate MIS and NRML tables
        run: |
          python - <<'PY'
          from google.cloud import bigquery

          client = bigquery.Client()

          tables = [
              "kiteconnect2025.pnl_book.MIS_trade_pairs",
              "kiteconnect2025.pnl_book.NRML_trade_pairs",
          ]

          for table_id in tables:
              print(f"Deleting existing table: {table_id}")
              client.delete_table(table_id, not_found_ok=True)

              print(f"Creating empty table: {table_id}")
              client.create_table(bigquery.Table(table_id))

              print(f"Successfully recreated: {table_id}")
          PY
